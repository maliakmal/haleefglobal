name: Deploy production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: haleef-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check PHP runtime
        run: php --version
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Reject committed secrets
        run: test ! -f .env
      - name: Check analytics consent and event privacy
        run: node bin/smoke-analytics.cjs

  learning-smoke:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: smoke-root
          MARIADB_DATABASE: haleef_test
          MARIADB_USER: haleef_test
          MARIADB_PASSWORD: smoke-pass
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=4s --health-retries=15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install invoice PDF dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Exercise Learning workflows against MariaDB
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_DATABASE: haleef_test
          DB_USERNAME: haleef_test
          DB_PASSWORD: smoke-pass
        run: bash bin/smoke-learning.sh

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, learning-smoke]
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_ROOT: /var/www/haleefglobal
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare invoice PDF dependencies for the release
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload immutable release
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          release="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::12}"
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$APP_ROOT/releases/$release'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='storage/private/***' \
            --exclude='storage/logs/***' \
            --exclude='storage/public-resources/***' \
            --exclude='storage/backups/***' \
            -e "ssh -p $port" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_ROOT/releases/$release/"
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' HEALTHCHECK_HOST='www.haleefglobal.com' bash '$APP_ROOT/releases/$release/deploy/remote-release.sh' '$release'"
