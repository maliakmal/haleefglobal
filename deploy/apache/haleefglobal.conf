# Install as /etc/apache2/sites-available/haleefglobal.conf.
# This file does not alter the existing Sendy or Haleef Learning virtual hosts.

<VirtualHost *:80>
    ServerName www.haleefglobal.com
    ServerAlias haleefglobal.com
    DocumentRoot /var/www/haleefglobal/current

    <Directory /var/www/haleefglobal/current>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/haleefglobal-error.log
    CustomLog ${APACHE_LOG_DIR}/haleefglobal-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName resources.haleefglobal.com
    DocumentRoot /var/www/haleefglobal/shared/public-resources/haleef-global

    <Directory /var/www/haleefglobal/shared/public-resources/haleef-global>
        Options -Indexes
        AllowOverride None
        Require all granted
        php_admin_flag engine off

        <FilesMatch "\.(?:php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "public, max-age=86400"
    ErrorLog ${APACHE_LOG_DIR}/haleefglobal-resources-error.log
    CustomLog ${APACHE_LOG_DIR}/haleefglobal-resources-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName resources.haleeflearning.com
    DocumentRoot /var/www/haleefglobal/shared/public-resources/haleef-learning

    <Directory /var/www/haleefglobal/shared/public-resources/haleef-learning>
        Options -Indexes
        AllowOverride None
        Require all granted
        php_admin_flag engine off

        <FilesMatch "\.(?:php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "public, max-age=86400"
    ErrorLog ${APACHE_LOG_DIR}/haleeflearning-resources-error.log
    CustomLog ${APACHE_LOG_DIR}/haleeflearning-resources-access.log combined
</VirtualHost>
