# Install as /etc/nginx/sites-available/haleefglobal, then enable it with a symlink.
# Certbot will add the HTTPS listeners after these hosts resolve to the Droplet.

server {
    listen 80;
    listen [::]:80;
    server_name haleefglobal.com;
    return 301 https://www.haleefglobal.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.haleefglobal.com;
    root /var/www/haleefglobal/current;
    index index.php;
    client_max_body_size 15m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:app|bin|database|deploy|docs|includes|storage)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

server {
    listen 80;
    listen [::]:80;
    server_name haleeflearning.com www.haleeflearning.com;
    return 301 https://www.haleefglobal.com/training;
}

server {
    listen 80;
    listen [::]:80;
    server_name resources.haleefglobal.com;
    root /var/www/haleefglobal/shared/public-resources/haleef-global;
    autoindex off;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    listen [::]:80;
    server_name resources.haleeflearning.com;
    root /var/www/haleefglobal/shared/public-resources/haleef-learning;
    autoindex off;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
